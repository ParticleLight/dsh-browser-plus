<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="dsh-browser-plus">
  <!-- Minimal white line art on the browser's own surface colour. The plate is what
       keeps a white outline legible on a light taskbar; on a dark one it disappears. -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="#202124"/>
  <g transform="translate(20 20) scale(9)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.25" y="4.75" width="17.5" height="14.5" rx="3.25"/>
    <path d="M3.25 9.4h17.5"/>
    <circle cx="6.15" cy="7.05" r=".9" fill="#ffffff" stroke="none"/>
    <circle cx="8.75" cy="7.05" r=".9" fill="#ffffff" stroke="none"/>
  </g>
</svg>
