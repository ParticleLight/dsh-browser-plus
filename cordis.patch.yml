# dsh-browser-plus bundle patch: mounts the shared-browser capability into a
# profile composition. The browser seam (ctx.browser) is always mounted. The
# Electron provider and browser_* tools are ALWAYS registered: when the host
# provides `electronViewHost` (the desktop shell) that embedded view is used,
# and otherwise the plugin self-hosts its own Electron window, so installing
# the plugin is enough for the browser to work anywhere.
- insert:
    # Root row: no behaviour of its own, but the client module system only reads
    # a package's `dsh.client` from a Loader row whose specifier is the EXACT
    # package root (a subpath resolves to undefined and is skipped). Without this
    # row the Web GUI panel is never composed, however many subpath rows exist.
    - id: browser-plus
      name: dsh-browser-plus

    - id: browser
      name: dsh-browser-plus/browser

    - id: browser-electron
      name: dsh-browser-plus/browser-electron
      config:
        viewHost: !!js ctx.get('electronViewHost')

    - id: tool-browser
      name: dsh-browser-plus/tool-browser

    # Human-facing `/browser`: opens/raises the shared window without the model.
    # Its own row on purpose — a composition without the command registry must
    # still get the tools above.
    - id: browser-command
      name: dsh-browser-plus/command-browser

    # The Web GUI panel's bridge: opens/raises the window from a button in the
    # right sidebar. Needs the web server, so it is its own row too.
    - id: browser-http
      name: dsh-browser-plus/http-browser

    # Bridges the Agent's todo list (DSH session projection) into the browser, so
    # the floating orb can show what the Agent is working on. Its own row because
    # it needs optional services the browser itself does not.
    - id: browser-task-todos
      name: dsh-browser-plus/task-todos
